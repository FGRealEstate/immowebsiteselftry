[build]
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Update 32 §7.3: Sammel-Build der Propstack-Webhooks, alle 2 Minuten (netlify/functions/_shared/build-sammler.js)
[functions."propstack-build-sammler"]
  schedule = "*/2 * * * *"

# Update 40 §1.2: täglicher Produktions-Build um 06:00 deutscher Zeit (netlify/functions/taeglicher-build.js).
# Netlify rechnet in UTC: Lauf um 04:00 und 05:00 UTC, gebaut wird nur, wenn es in Berlin 6 Uhr ist (Sommer- und Winterzeit).
[functions."taeglicher-build"]
  schedule = "0 4,5 * * *"

# Update 7 §4: Propstack-Fotos über das Netlify Image CDN (/.netlify/images?url=…), Filter propstackFoto in .eleventy.js.
[images]
  remote_images = ["https://images\\.propstack\\.de/.*"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
